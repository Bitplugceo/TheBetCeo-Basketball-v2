:root {

  --section-toggle-text: #20242c;
  --section-toggle-icon: #d91f26;
  --table-border: #dfe2e7;
  --tracker-head-bg: #3a404c;
  --tracker-head-text: #ffffff;
  --tracker-summary-bg: #f6f7f9;
  --tracker-strong: #20242c;
  --tracker-subtext: #5a5f6b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: #e41827; height: 100%; }
html, body { background-color: #f4f4f5; }
body {
  margin: 0; padding: 0;
  background: #f4f4f5;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, input, select, .section, table, th, td, .tracker-panel { border-radius: 0; }

.app-header {
  position: relative; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  margin: 0;
  padding-top: 12px;
  padding-left: max(14px, env(safe-area-inset-left));
  padding-right: max(14px, env(safe-area-inset-right));
  padding-bottom: 10px;
  min-height: 54px;
  background: #e41827; color: #fff;
  box-shadow: none; border-bottom: none;
}
.brand-name {
  font-family: Nunito, "Avenir Next", "Arial Black", sans-serif;
  font-size: 23px; font-weight: 900; font-style: italic;
  letter-spacing: -0.4px; color: #fff; line-height: 1;
}
.brand-right {

  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  color: rgba(255,255,255,0.85); text-transform: uppercase;
}
.header-icon-btn {
  background: none !important; border: none !important; box-shadow: none !important;
  padding: 0 !important; margin: 0 !important;
  font-size: 11px !important; font-weight: 700 !important;
  letter-spacing: 1.5px !important;
  color: rgba(255,255,255,0.85) !important;
  text-transform: uppercase !important;
  cursor: pointer !important; opacity: 1 !important;
}
.wrapper {
  max-width: 760px; margin: 0 auto;
  padding: 10px 10px 0; background: transparent;
}
.section {
  border: 1px solid var(--panel-border);
  background: var(--panel);
  margin: 8px 0; width: 100%;
  box-sizing: border-box;
  box-shadow: var(--shadow);
  color: var(--text);
}
.section-toggle {
  width: 100%; background: none !important; border: none;
  padding: 12px 10px; margin: 0 !important;
  color: var(--section-toggle-text) !important;
  display: flex; align-items: center; justify-content: space-between;
  text-align: left; cursor: pointer;
}
.section-toggle .toggle-title {
  display: block; font-weight: 800;
  color: var(--section-toggle-text) !important; font-size: 16px;
}
.section-toggle .toggle-icon {
  font-size: 15px; line-height: 1;
  transition: transform 0.2s ease;
  color: #e53935 !important; display: inline-block !important;
}
.section-body { padding: 0 10px 10px; margin-top: 0; }
.section.collapsed .section-body { display: none; }
.section.collapsed .section-toggle .toggle-icon { transform: rotate(-90deg); }

h3 { margin: 0; font-size: 16px; font-weight: 800; }
label {
  display: block; font-size: 12px; margin-bottom: 4px;
  color: var(--text); font-weight: 600;
}
input, .league-box, select.league-box {
  width: 100%; max-width: 260px; box-sizing: border-box;
  display: block; padding: 6px 8px; font-size: 12px;
  background: var(--input-bg); color: var(--text);
  border: 1px solid var(--input-border); margin-bottom: 6px;
  appearance: none; -webkit-appearance: none;
}
input:focus, select:focus {
  outline: none; border-color: #4aa346;
  box-shadow: 0 0 0 2px rgba(74,163,70,0.12);
}
input::placeholder { color: var(--muted); opacity: 0.75; }
button {
  padding: 8px 16px; margin: 6px; font-weight: 700;
  background: #313744; color: #fff; border: none; cursor: pointer;
}
button:hover { opacity: 0.95; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.actions { text-align: center; padding-bottom: 20px; }
#runBtn, #clearBtn {
  opacity: 1 !important; border: none !important; cursor: pointer !important;
  padding: 5px 14px !important; font-size: 12px !important;
  font-weight: 700 !important; min-width: 0 !important; width: auto !important;
}
#runBtn {

}
#clearBtn {

}
.gold-icon-btn {

  font-weight: 700 !important; border: none !important;
  padding: 5px 14px !important; font-size: 12px !important;
  cursor: pointer !important; width: auto !important; min-width: 0 !important;
}

.table-wrap { overflow-x: auto; margin: 0 6px 10px; }
table {
  width: 100%; border-collapse: collapse; margin-top: 10px;
  font-size: 12px; background: var(--panel) !important;
}
th, td {
  border: 1px solid var(--table-border);
  padding: 10px 8px !important; text-align: center; vertical-align: middle;
}
th { background: var(--table-head) !important; color: #fff !important; font-weight: 700; }
td { background: var(--panel) !important; color: var(--text) !important; font-weight: 600 !important; }
.pred-over { background: #3a9c35 !important; color: #fff !important; font-weight: 800 !important; }
.pred-under { background: #c91920 !important; color: #fff !important; font-weight: 800 !important; }
.pred-none { background: #888 !important; color: #fff !important; }
.status-line {

.market-grid {

}
.form-grid {

}

/* Tracker modal — BB chrome subset */
.tracker-modal {

  padding-right: env(safe-area-inset-right);

.tracker-modal.open { display: flex; }
.tracker-panel {

.tracker-tabs {

.tracker-tab {

.tracker-tab.active {

.tracker-body-scroll {

  padding: 10px 12px max(8px, env(safe-area-inset-bottom));
}
.tracker-empty {
  text-align: center; padding: 40px 16px; color: var(--muted);
  font-size: 13px; font-weight: 700;
}
.tracker-card {
  border: 1px solid var(--panel-border); background: var(--panel);
  padding: 10px; margin-bottom: 8px;
}
.tracker-card .tc-title { font-weight: 800; font-size: 13px; }
.tracker-card .tc-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
.tracker-card .tc-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.tracker-card .tc-actions button {
  padding: 4px 10px; font-size: 11px; margin: 0;

/* Debug overlay */
#debugOverlay {

#debugOverlay.open { display: flex; }
.debug-panel {

.debug-panel h3 { color: #fff; margin: 0 0 10px; font-size: 14px; }
.debug-panel input {

  font-family: inherit;
}
.debug-panel .dbg-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.debug-panel .dbg-actions button {

#debugLog {

.raid-toast.show { display: block; }
.build-chip {

.raw-peek {

  max-height: 100px; overflow: auto; white-space: pre-wrap;
  color: #c9a66b; margin-top: 6px; font-size: 10px;
}
</style>
</head>

  function pushReqLog(entry) {
    const line = (entry.ms != null ? entry.ms + "ms " : "") +
      (entry.status != null ? "[" + entry.status + "] " : "") +
      (entry.method || "GET") + " " + (entry.url || "") +
      (entry.error ? " ERR " + entry.error : "");
    reqLogLines.push(line);
    if (reqLogLines.length > 80) reqLogLines.shift();
    const el = $("reqLog");

  function lsGet(key, fallback) {

  }
  function lsSet(key, val) {

  function workerBase() {

  async function ttFetch(url, opts) {
    const t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    const ctrl = new AbortController();
    const timeout = (opts && opts.timeout) || 20000;
    const timer = setTimeout(() => ctrl.abort(), timeout);
    let status = 0, errMsg = null, data = null;
    try {
      const res = await fetch(url, {
        signal: ctrl.signal,
        cache: "no-store",
        headers: { Accept: "application/json" },
      });
      status = res.status;
      const textBody = await res.text();
      try { data = textBody ? JSON.parse(textBody) : null; }
      catch (_e) { data = textBody; }
      if (!res.ok) throw new Error("HTTP " + res.status);
      setRawPeek(data);
      return data;
    } catch (e) {
      errMsg = e && e.name === "AbortError" ? "timeout" : (e && e.message ? e.message : String(e));
      throw e;
    } finally {
      clearTimeout(timer);
      const t1 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
      pushReqLog({
        url: url,
        status: status || null,
        ms: Math.round(t1 - t0),
        error: errMsg,
        method: "GET",
      });
    }
  }

  function parseSeries(str) {
    if (!str || !String(str).trim()) return [];
    return String(str).split(/[,\s]+/).map((x) => parseFloat(x)).filter((n) => !isNaN(n) && n > 0);
  }
  function avg(arr) {
    if (!arr || !arr.length) return null;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
  }
  function clamp(n, lo, hi) {
    return Math.max(lo, Math.min(hi, n));
  }
  function weightedMean(pairs) {
    // pairs: [{v, w}]
    let sw = 0, sv = 0;
    pairs.forEach((p) => {
      if (p.v == null || !isFinite(p.v) || !(p.w > 0)) return;
      sw += p.w; sv += p.v * p.w;
    });
    return sw > 0 ? sv / sw : null;
  }

    const a = Number(actual), L = Number(line);

  function padDocumentCode(code) {

  function parseGameScores(str) {
    if (!str || typeof str !== "string") return [];

  /* ---- Transparent TT prediction model ---- */
  function expectedGamesBO(bestOf, pWin) {
    // pWin = P(player1 wins a game), approximate independence
    const p = clamp(pWin == null ? 0.5 : pWin, 0.15, 0.85);
    const q = 1 - p;
    const need = Math.ceil(bestOf / 2);
    // Expected length for best-of-N first-to-need
    // E ≈ sum_{k=need}^{bestOf} k * P(ends at k)
    let e = 0, mass = 0;
    for (let k = need; k <= bestOf; k++) {
      // ends at k: one side reaches need on game k → binomial
      const prev = k - 1;
      // P(A wins in k): A has need-1 in prev, wins k; B has prev-(need-1)
      const bWins = prev - (need - 1);
      if (bWins < 0 || bWins >= need) continue;
      const comb = binomial(prev, need - 1);
      const pA = comb * Math.pow(p, need - 1) * Math.pow(q, bWins) * p;
      const pB = comb * Math.pow(q, need - 1) * Math.pow(p, bWins) * q;
      e += k * (pA + pB);
      mass += pA + pB;
    }
    if (mass < 0.5) {
      // fallback competitive length
      return bestOf === 7 ? 5.5 : 4.3;
    }
    return e / mass;
  }
  function binomial(n, k) {
    if (k < 0 || k > n) return 0;
    k = Math.min(k, n - k);
    let r = 1;
    for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i;
    return r;
  }

  function estimateGameWinProb(aG1, bG1, aMt, bMt, ratingA, ratingB) {
    // Higher recent totals often = longer / higher-scoring styles; use mild strength proxy
    const aForm = avg(aMt) || avg(aG1);
    const bForm = avg(bMt) || avg(bG1);
    let delta = 0;
    if (aForm != null && bForm != null) delta += (aForm - bForm) / 40;
    if (ratingA != null && ratingB != null && isFinite(ratingA) && isFinite(ratingB)) {
      delta += (ratingA - ratingB) / 400;
    }
    return clamp(0.5 + delta, 0.2, 0.8);
  }

  function unitsFromEdge(edge, line) {
    if (edge == null || line == null || !isFinite(edge) || !isFinite(line)) return 0;
    const abs = Math.abs(edge);
    if (abs < NO_PLAY_EDGE) return 0;
    const edgePct = (abs / Math.max(Math.abs(line), 1)) * 100;
    // ~0.4 pts ≈ 0.5u floor; scale; cap 3u
    const u = clamp(0.25 + abs * 0.4 + edgePct * 0.04, 0.25, 3);
    return Math.round(u * 4) / 4; // quarter units
  }

  function gradeFromEdge(edge, dataScore) {
    const abs = Math.abs(edge || 0);
    if (dataScore < 0.25) return "THIN";
    if (abs < NO_PLAY_EDGE) return "PASS";
    if (abs >= 1.8 && dataScore >= 0.6) return "A";
    if (abs >= 1.0 && dataScore >= 0.45) return "B";
    if (abs >= 0.55) return "C";
    return "D";
  }

  function projectMarkets(inputs) {
    const aG1 = inputs.aG1 || [];
    const bG1 = inputs.bG1 || [];
    const aMt = inputs.aMt || [];
    const bMt = inputs.bMt || [];
    const h2hG1 = inputs.h2hG1 || [];
    const h2hMt = inputs.h2hMt || [];
    const bestOf = inputs.bestOf || 5;
    const ratingA = inputs.ratingA;
    const ratingB = inputs.ratingB;

    const formG1 = weightedMean([
      { v: avg(aG1), w: aG1.length ? Math.min(aG1.length, 8) : 0 },
      { v: avg(bG1), w: bG1.length ? Math.min(bG1.length, 8) : 0 },
    ]);
    const h2hG1Avg = avg(h2hG1);
    const projG1 = weightedMean([
      { v: BASELINE_G1, w: 1.0 },
      { v: formG1, w: formG1 != null ? 2.2 : 0 },
      { v: h2hG1Avg, w: h2hG1Avg != null ? 1.6 : 0 },
    ]) || BASELINE_G1;

    const pWin = estimateGameWinProb(aG1, bG1, aMt, bMt, ratingA, ratingB);
    const expGames = expectedGamesBO(bestOf, pWin);
    const baselineMt = expGames * BASELINE_PER_GAME;
    // Prefer observed match totals (already sum of game points)
    const formMt = weightedMean([
      { v: avg(aMt), w: aMt.length ? Math.min(aMt.length, 8) : 0 },
      { v: avg(bMt), w: bMt.length ? Math.min(bMt.length, 8) : 0 },
    ]);
    // If only G1 form, scale by expected games
    const scaledFromG1 = formG1 != null ? formG1 * expGames : null;
    const h2hMtAvg = avg(h2hMt);
    const projMt = weightedMean([
      { v: baselineMt, w: 1.0 },
      { v: formMt, w: formMt != null ? 2.4 : 0 },
      { v: scaledFromG1, w: formMt == null && scaledFromG1 != null ? 1.4 : 0 },
      { v: h2hMtAvg, w: h2hMtAvg != null ? 1.8 : 0 },
    ]) || baselineMt;

    const dataPts =
      (aG1.length ? 1 : 0) + (bG1.length ? 1 : 0) +
      (aMt.length ? 1 : 0) + (bMt.length ? 1 : 0) +
      (h2hG1.length ? 1 : 0) + (h2hMt.length ? 1 : 0);
    const dataScore = clamp(dataPts / 6, 0, 1);

    return {
      projG1, projMt, expGames, pWin, dataScore, baselineMt,
      thin: dataScore < 0.15,
    };
  }

  function buildRow(name, key, line, proj, dataScore) {
    const hasLine = line != null && !isNaN(line);
    const projection = proj != null && isFinite(proj) ? proj.toFixed(1) : "—";
    let edgeNum = null;
    if (hasLine && proj != null && isFinite(proj)) edgeNum = proj - line;
    const edge = edgeNum != null ? edgeNum.toFixed(1) : "—";
    const units = hasLine && edgeNum != null ? unitsFromEdge(edgeNum, line) : 0;
    let side = "NO PLAY";
    if (hasLine && edgeNum != null && units > 0) {
      side = edgeNum > 0 ? "OVER" : edgeNum < 0 ? "UNDER" : "NO PLAY";
    } else if (!hasLine) {
      side = "NO PLAY";
    } else if (dataScore < 0.12) {
      side = "NO PLAY";
    }
    const cls = side === "OVER" ? "pred-over" : side === "UNDER" ? "pred-under" : "pred-none";
    const grade = gradeFromEdge(edgeNum, dataScore);
    return {
      name, key,
      line: hasLine ? line : null,
      projection, edge, edgeNum,
      grade,
      units: units.toFixed(1) + "u",
      unitsNum: units,
      side, cls,
      projNum: proj,
    };
  }

  async function runEngine() {
    try {
      const league = (($("leagueSelect") || {}).value || "").toLowerCase();
      await maybeAutofillOnRun(league);

      const g1Line = parseFloat(($("game1Market") || {}).value);
      const mtLine = parseFloat(($("matchTotalMarket") || {}).value);
      const aG1 = parseSeries(($("aGame1Pts") || {}).value);
      const bG1 = parseSeries(($("bGame1Pts") || {}).value);
      const aMt = parseSeries(($("aMatchPts") || {}).value);
      const bMt = parseSeries(($("bMatchPts") || {}).value);
      const h2hG1 = parseSeries(($("h2hGame1") || {}).value);
      const h2hMt = parseSeries(($("h2hMatch") || {}).value);

      const bestOf = (selectedMatch && selectedMatch.bestOf) || 5;
      const ratingA = selectedMatch && selectedMatch.player1 && selectedMatch.player1.rating;
      const ratingB = selectedMatch && selectedMatch.player2 && selectedMatch.player2.rating;

      const model = projectMarkets({
        aG1, bG1, aMt, bMt, h2hG1, h2hMt, bestOf, ratingA, ratingB,
      });

      const rows = [
        buildRow("1st Game Total", "game1_total", isNaN(g1Line) ? null : g1Line, model.projG1, model.dataScore),
        buildRow("Match Total Points", "match_total", isNaN(mtLine) ? null : mtLine, model.projMt, model.dataScore),
      ];

      const tbody = $("resultsBody");
      const table = $("results");
      if (tbody && table) {
        tbody.innerHTML = rows.map((r) =>
          "<tr><td>" + r.name + "</td><td>" + r.projection +
          "</td><td>" + r.edge + "</td><td>" + r.grade +
          '</td><td class="' + r.cls + '">' + r.side + " · " + r.units + "</td></tr>"
        ).join("");
        table.style.display = "";
      }
      window.__ttLastRows = rows;
      window.__ttLastModel = model;
      const trackBtn = $("trackPickBtn");
      if (trackBtn) trackBtn.style.display = "";
      const playable = rows.filter((r) => r.unitsNum > 0).length;
      setStatus(
        "Run · proj G1 " + model.projG1.toFixed(1) +
        " / MT " + model.projMt.toFixed(1) +
        " · E[games] " + model.expGames.toFixed(2) +
        " · " + playable + " play(s) · " + BUILD_ID,
        "ok"
      );
      engineDebug("runEngine ok", {
        projG1: model.projG1, projMt: model.projMt,
        expGames: model.expGames, dataScore: model.dataScore, playable,
      });
      accordionOpen("marketSection");
    } catch (err) {
      setStatus("Run error: " + (err && err.message ? err.message : String(err)), "err");
      engineDebug("runEngine crash caught", { error: String(err) });
    }
  }

  function trackCurrentPick() {
    const rows = window.__ttLastRows || [];
    if (!rows.length) { setStatus("Run first", "err"); return; }
    const a = (($("playerAName") || {}).value || "Player A").trim();
    const b = (($("playerBName") || {}).value || "Player B").trim();
    const league = (($("leagueSelect") || {}).value || "").trim();
    const picks = loadPicks();
    const matchSnap = selectedMatch ? {
      id: selectedMatch.id,

      games: selectedMatch.games || [],
      status: selectedMatch.status,
      bestOf: selectedMatch.bestOf || 5,
      player1: selectedMatch.player1,
      player2: selectedMatch.player2,
    } : null;
    rows.forEach((r) => {
      if (r.line == null) return;
      picks.unshift({
        id: "tt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        createdAt: Date.now(),
        league, playerA: a, playerB: b,
        market: r.key, marketName: r.name,
        line: r.line, side: r.side,
        units: r.unitsNum || 0,
        projection: r.projNum,
        status: "active", settledAt: null, result: null,
        matchId: matchSnap && matchSnap.id,
        match: matchSnap,
      });
    });
    savePicks(picks);
    setStatus("Tracked " + rows.filter((r) => r.line != null).length + " pick(s)", "ok");
    openTracker();
  }

  function settlePick(id, result) {
    const picks = loadPicks();
    const p = picks.find((x) => x.id === id);
    if (!p) return;
    p.status = "settled";
    p.result = result;
    p.settledAt = Date.now();
    savePicks(picks);
    renderTracker();
  }

  function autoSettleFromMatch(pick, match) {
    if (!pick || !match || pick.status !== "active") return false;
    if (match.status !== "finished" && !(match.games && match.games.length)) return false;
    const actual = pick.market === "game1_total" ? game1Total(match) : matchTotalPts(match);
    if (actual == null) return false;
    const side = settleSide(actual, pick.line);
    if (!side) return false;
    // Map over/under/push vs pick.side
    const pickSide = String(pick.side || "").toLowerCase();
    let result = "push";
    if (side === "push") result = "push";
    else if (pickSide.indexOf("over") >= 0) result = side === "over" ? "won" : "lost";
    else if (pickSide.indexOf("under") >= 0) result = side === "under" ? "won" : "lost";
    else result = side;
    pick.status = "settled";
    pick.result = result;
    pick.actual = actual;
    pick.settledAt = Date.now();
    pick.match = Object.assign({}, pick.match || {}, {
      games: match.games, status: match.status || "finished",
    });
    return true;
  }

  function deletePick(id) {
    let picks = loadPicks();
    const p = picks.find((x) => x.id === id);
    if (!p) return;
    picks = picks.filter((x) => x.id !== id);
    savePicks(picks);
    const del = loadDeleted();
    del.unshift(Object.assign({}, p, { deletedAt: Date.now() }));
    saveDeleted(del.slice(0, 200));
    renderTracker();
  }

  function renderTracker() {
    const list = $("trackerList");
    const empty = $("trackerEmpty");
    if (!list) return;
    const now = Date.now();
    let picks = loadPicks();
    let items = [];
    if (trackerTab === "active") {
      items = picks.filter((p) => p.status === "active");
    } else if (trackerTab === "archive") {
      items = picks.filter((p) => p.status === "settled" && p.settledAt && (now - p.settledAt) < TRACKER_SETTLED_VISIBLE_MS);
    } else {
      items = loadDeleted();
    }
    if (!items.length) {
      list.innerHTML = "";
      if (empty) { empty.style.display = ""; empty.textContent = "No tracked picks yet."; }
      return;
    }
    if (empty) empty.style.display = "none";
    list.innerHTML = items.map((p) => {
      const title = (p.playerA || "?") + " vs " + (p.playerB || "?");
      const u = (p.units != null ? Number(p.units).toFixed(1) : "0.0") + "u";
      const meta = (p.league || "—") + " · " + (p.marketName || p.market) + " " +
        (p.side || "") + " " + (p.line != null ? p.line : "") +
        (p.result ? " · " + p.result : "") +
        (p.actual != null ? " · actual " + p.actual : "") +
        " · " + u;
      let actions = "";
      if (trackerTab === "active") {
        actions = '<button type="button" data-act="won" data-id="' + p.id + '">Won</button>' +
          '<button type="button" data-act="lost" data-id="' + p.id + '">Lost</button>' +
          '<button type="button" data-act="push" data-id="' + p.id + '">Push</button>' +
          '<button type="button" data-act="del" data-id="' + p.id + '">Delete</button>';
      }
      return '<div class="tracker-card"><div class="tc-title">' + title +
        '</div><div class="tc-meta">' + meta + '</div>' +
        (actions ? '<div class="tc-actions">' + actions + "</div>" : "") + "</div>";
    }).join("");
    list.querySelectorAll("button[data-act]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-id");
        const act = btn.getAttribute("data-act");
        if (act === "del") deletePick(id);
        else settlePick(id, act);
      });
    });
  }

  /* ---- Military Raid ---- */
  function runMilitaryRaid() {
    const now = Date.now();
    let picks = loadPicks();
    let settledN = 0;
    // Refresh settle from stored match games
    picks.forEach((p) => {
      if (p.status === "active" && p.match && p.match.games && p.match.games.length) {
        const st = p.match.status;
        if (st === "finished" || (p.match.games && p.match.games.length >= 3)) {
          if (autoSettleFromMatch(p, p.match)) settledN++;
        }
      }
    });
    // Also try fixtureMap by matchId
    picks.forEach((p) => {
      if (p.status !== "active" || !p.matchId) return;
      const fx = fixtureMap[p.matchId];
      if (fx && fx._tt) {
        if (autoSettleFromMatch(p, fx._tt)) settledN++;
      }
    });

    const kept = [];
    const pruned = [];
    picks.forEach((p) => {
      if (p.status === "settled" && p.settledAt && (now - p.settledAt) >= TRACKER_SETTLED_VISIBLE_MS) {
        pruned.push(p);
      } else kept.push(p);
    });
    savePicks(kept);
    let del = loadDeleted();
    const beforeDel = del.length;
    del = del.filter((p) => !p.deletedAt || (now - p.deletedAt) < TRACKER_SETTLED_VISIBLE_MS * 3);
    saveDeleted(del);
    engineDebug("military raid", {
      pruned: pruned.length, kept: kept.length, settled: settledN,
      tombstonesPurged: beforeDel - del.length,
    });
    const toast = $("raidToast");
    if (toast) {
      toast.textContent = "Raid · settled " + settledN + " · archived " + pruned.length;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }
    renderTracker();
    closeDebug();
    openTracker();
    setStatus("Military raid complete", "ok");
  }

  async function fetchSetkaPlayer(rawId) {
    const wb = workerBase();
    if (!wb || rawId == null) return null;
    try {
      return await ttFetch(wb + "/tt/setka/player/" + encodeURIComponent(rawId), { timeout: 15000 });
    } catch (e) {
      engineDebug("setka player miss", { rawId, error: String(e && e.message || e) });
      return null;
    }
  }

  function extractSeriesFromSetkaPlayer(playerPayload, playerRawId) {
    // Flexible parse: look for matches / lastMatches / history with setScores
    const g1 = [], mt = [];
    if (!playerPayload) return { g1, mt };
    const root = playerPayload.player || playerPayload;
    const matches =
      root.matches || root.lastMatches || root.history || root.recentMatches ||
      playerPayload.matches || playerPayload.lastMatches || [];
    const list = Array.isArray(matches) ? matches : [];
    list.slice(0, 10).forEach((m) => {
      const scores = m.setScores || m.SetScores || [];
      if (!Array.isArray(scores) || !scores.length) return;
      const games = scores.map((s) => ({
        p1: Number(s.p1Score != null ? s.p1Score : s.homeScore) || 0,
        p2: Number(s.p2Score != null ? s.p2Score : s.awayScore) || 0,
        n: s.number || 0,
      }));
      const first = games.find((g) => g.n === 1) || games[0];
      if (first) g1.push(first.p1 + first.p2);
      const total = games.reduce((s, g) => s + g.p1 + g.p2, 0);
      if (total > 0) mt.push(total);
    });
    return { g1, mt };
  }

  function extractH2H(matches, idA, idB) {
    const g1 = [], mt = [];
    if (!Array.isArray(matches)) return { g1, mt };
    const a = String(idA), b = String(idB);
    matches.forEach((m) => {
      const p1id = String((m.player1 && m.player1.id) || m.p1Id || "");
      const p2id = String((m.player2 && m.player2.id) || m.p2Id || "");
      const pair = (p1id === a && p2id === b) || (p1id === b && p2id === a);
      if (!pair) return;
      const scores = m.setScores || [];
      if (!scores.length) return;
      const games = scores.map((s) => ({
        p1: Number(s.p1Score) || 0, p2: Number(s.p2Score) || 0, n: s.number || 0,
      }));
      const first = games.find((g) => g.n === 1) || games[0];
      if (first) g1.push(first.p1 + first.p2);
      mt.push(games.reduce((s, g) => s + g.p1 + g.p2, 0));
    });
    return { g1: g1.slice(0, 8), mt: mt.slice(0, 8) };
  }

  async function autofillFormFromSetkaHistory(norm) {
    if (!norm || norm.league !== "setka") return;
    const idA = norm.player1 && norm.player1.rawId;
    const idB = norm.player2 && norm.player2.rawId;
    const [pa, pb] = await Promise.all([fetchSetkaPlayer(idA), fetchSetkaPlayer(idB)]);
    const sa = extractSeriesFromSetkaPlayer(pa, idA);
    const sb = extractSeriesFromSetkaPlayer(pb, idB);
    if (sa.g1.length && $("aGame1Pts") && !$("aGame1Pts").value) $("aGame1Pts").value = sa.g1.join(",");
    if (sa.mt.length && $("aMatchPts") && !$("aMatchPts").value) $("aMatchPts").value = sa.mt.join(",");
    if (sb.g1.length && $("bGame1Pts") && !$("bGame1Pts").value) $("bGame1Pts").value = sb.g1.join(",");
    if (sb.mt.length && $("bMatchPts") && !$("bMatchPts").value) $("bMatchPts").value = sb.mt.join(",");

    // H2H from today's fixture pool (finished matches between same pair)
    const allNorms = Object.keys(fixtureMap).map((k) => fixtureMap[k]._tt).filter(Boolean);
    const finishedRaws = allNorms.map((n) => n.raw).filter(Boolean);
    const h2h = extractH2H(finishedRaws, idA, idB);
    if (h2h.g1.length && $("h2hGame1") && !$("h2hGame1").value) $("h2hGame1").value = h2h.g1.join(",");
    if (h2h.mt.length && $("h2hMatch") && !$("h2hMatch").value) $("h2hMatch").value = h2h.mt.join(",");
    engineDebug("autofill history", {
      aG1: sa.g1.length, aMt: sa.mt.length, bG1: sb.g1.length, bMt: sb.mt.length,
      h2hG1: h2h.g1.length, h2hMt: h2h.mt.length,
    });
  }

  async function loadSetkaOptions(dateStr) {
    const data = await fetchSetkaTournaments(dateStr);
    setRawPeek(data);
    const tournaments = Array.isArray(data) ? data : (data.tournaments || data.items || []);
    const options = [];
    (Array.isArray(tournaments) ? tournaments : []).forEach((t) => {
      const tName = (t && (t.name || t.tournamentName || t.token)) || "Setka";
      const matches = (t && (t.matches || t.Matches)) || [];
      matches.forEach((m) => {
        const norm = normalizeSetkaMatch(m, tName);
        const label =
          (norm.startTime ? String(norm.startTime).slice(11, 16) + " " : "") +
          norm.player1.displayName + " vs " + norm.player2.displayName +
          " · " + (norm.competitionName || tName) +
          (norm.status === "finished" ? " ✓" : "");
        options.push({
          id: norm.id,
          label,
          home: norm.player1.displayName,
          away: norm.player2.displayName,
          date: norm.startTime,
          status: norm.status,
          _tt: norm,
        });
      });
    });
    return options;
  }

  async function loadWttOptions(filterHint) {
    // Direct CMS (CORS *) — Worker optional
    let live = null;
    const wb = workerBase();
    try {
      if (wb) live = await ttFetch(wb + "/tt/wtt/live-events", { timeout: 15000 });
    } catch (_e) { live = null; }
    if (!live) {
      try {
        live = await ttFetch(WTT_CMS + "/GetLiveEvent", { timeout: 15000 });
      } catch (e1) {
        try {
          live = await ttFetch(WTT_CMS + "/GetAllLiveOrActiveEvents", { timeout: 15000 });
        } catch (e2) {
          throw e2;
        }
      }
    }
    setRawPeek(live);
    let events = [];
    if (Array.isArray(live)) events = live;
    else if (live && Array.isArray(live.result)) events = live.result;
    else if (live && Array.isArray(live.events)) events = live.events;
    else if (live && (live.eventId || live.EventId || live.id)) events = [live];
    else if (live && typeof live === "object") {
      const vals = Object.values(live);
      events = vals.filter((v) => v && (v.eventId || v.EventId || v.id));
      if (!events.length) events = [live];
    }
    const hint = String(filterHint || "").toLowerCase();
    if (hint.indexOf("contender") >= 0) {
      events = events.filter((e) => /contender/i.test(JSON.stringify(e).slice(0, 400)));
      if (!events.length) events = Array.isArray(live) ? live : events;
    } else if (hint.indexOf("champion") >= 0) {
      events = events.filter((e) => /champion/i.test(JSON.stringify(e).slice(0, 400)));
      if (!events.length) events = Array.isArray(live) ? live : events;
    }

    const options = [];
    for (const ev of events.slice(0, 8)) {
      const eventId = String(ev.eventId || ev.EventId || ev.id || "").trim();
      if (!eventId) continue;
      let sched = null;
      try {
        if (wb) {
          try { sched = await ttFetch(wb + "/tt/wtt/schedule/" + encodeURIComponent(eventId), { timeout: 30000 }); }
          catch (_e) { sched = null; }
        }
        if (!sched) sched = await ttFetch(WTT_CMS + "/GetEventSchedule/" + encodeURIComponent(eventId), { timeout: 30000 });
      } catch (e) {
        engineDebug("wtt schedule miss", { eventId, error: String(e && e.message || e) });
        continue;
      }
      const units = (sched && (sched.units || sched.Units || sched.schedule || sched.Schedule)) || [];
      const unitList = Array.isArray(units) ? units : [];
      unitList.forEach((u) => {
        const code = u.Code || u.code || u.documentCode || "";
        if (!code) return;
        const startList = u.StartList || u.startList || [];
        let p1 = "P1", p2 = "P2";
        if (Array.isArray(startList) && startList.length >= 2) {
          const n1 = startList[0] || {};
          const n2 = startList[1] || {};
          p1 = [n1.GivenName || n1.givenName, n1.FamilyName || n1.familyName].filter(Boolean).join(" ") ||
            n1.PrintName || n1.printName || "P1";
          p2 = [n2.GivenName || n2.givenName, n2.FamilyName || n2.familyName].filter(Boolean).join(" ") ||
            n2.PrintName || n2.printName || "P2";
        } else if (u.Description || u.description) {
          const d = String(u.Description || u.description);
          if (/\svs\s/i.test(d)) {
            const parts = d.split(/\s+vs\s+/i);
            p1 = parts[0] || p1;
            p2 = parts[1] || p2;
          }
        }
        const doc = padDocumentCode(code);
        const id = "wtt:" + eventId + ":" + doc;
        const start = u.StartDateTime || u.startDateTime || u.ScheduleDate || "";
        const st = String(u.ScheduleStatus || u.resultStatus || "scheduled").toLowerCase();
        options.push({
          id,
          label: (start ? String(start).slice(11, 16) + " " : "") + p1 + " vs " + p2 + " · WTT",
          home: p1,
          away: p2,
          date: start,
          status: st,
          _tt: {
            id, league: "wtt", eventId, documentCode: doc,
            player1: { displayName: p1 },
            player2: { displayName: p2 },
            games: [],
            status: /official|finished|complete/i.test(st) ? "finished" : /live|running/i.test(st) ? "live" : "scheduled",
            competitionName: (ev.eventName || ev.EventName || ev.name || "WTT"),
            startTime: start,
            bestOf: 5,
          },
        });
      });
    }
    return options;
  }

  async function autofetchFixtures(forceLeague) {
    const league = String(forceLeague || (($("leagueSelect") || {}).value || "")).toLowerCase();
    if (!league) { setStatus("Select a league first", "err"); return; }
    setPickerStatus("Fetching…");
    setStatus("Autofetching…", "ok");
    try {
      let options = [];
      if (league === "setka") {
        const dateStr = todayYMD();
        options = await loadSetkaOptions(dateStr);
        setPickerStatus(options.length + " Setka fixtures (" + dateStr + ")");
      } else if (league === "wtt" || league === "wtt_contender" || league === "wtt_champions") {
        options = await loadWttOptions(league);
        setPickerStatus(options.length + " WTT schedule units");
      } else {
        setPickerStatus("No autofetch for this league (manual entry).");
        setStatus("Manual league — enter players & lines", "ok");
        return;
      }
      populateMatchSelect(options);
      setStatus("Autofetch ok · " + options.length + " matches", "ok");
      engineDebug("autofetch ok", { league, count: options.length });
      accordionOpen("leagueSection");
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      setPickerStatus("Fetch failed: " + msg);
      if (err && err.code === "NO_WORKER") {
        setStatus("Worker URL required for Setka", "err");
        openDebug();
      } else {
        setStatus("Autofetch failed: " + msg, "err");
      }
      engineDebug("autofetch error", { error: msg, league });
    }
  }

  async function onMatchPick(fromId) {
    const id = fromId || (($("matchSelect") || {}).value) || (($("fixtureSelect") || {}).value);
    if (!id) return;
    const row = fixtureMap[id];
    if (!row) return;
    // sync both selects
    if ($("matchSelect") && $("matchSelect").value !== id) $("matchSelect").value = id;
    if ($("fixtureSelect") && $("fixtureSelect").value !== id) $("fixtureSelect").value = id;
    selectedMatch = row._tt || null;
    if ($("playerAName")) $("playerAName").value = row.home || "";
    if ($("playerBName")) $("playerBName").value = row.away || "";
    accordionOpen("marketSection");
    setStatus("Match selected: " + (row.home || "") + " vs " + (row.away || ""), "ok");
    if (selectedMatch && selectedMatch.league === "setka") {
      try { await autofillFormFromSetkaHistory(selectedMatch); }
      catch (e) { engineDebug("autofill fail", { error: String(e) }); }
    }
    // Optional: fetch WTT card for live/finished scores (settle enrichment)
    if (selectedMatch && selectedMatch.league === "wtt" && selectedMatch.eventId && selectedMatch.documentCode) {
      try {
        const wb = workerBase();
        let card = null;
        const path = "/GetMatchCardDetails_Minimal/" +
          encodeURIComponent(selectedMatch.eventId) + "/" + encodeURIComponent(selectedMatch.documentCode);
        if (wb) {
          try {
            card = await ttFetch(
              wb + "/tt/wtt/card/" + encodeURIComponent(selectedMatch.eventId) + "/" + encodeURIComponent(selectedMatch.documentCode),
              { timeout: 12000 }
            );
          } catch (_e) { card = null; }
        }
        if (!card) card = await ttFetch(WTT_CMS + path, { timeout: 12000 });
        if (card) {
          const gs = card.resultsGameScores || card.gameScores || "";
          selectedMatch.games = parseGameScores(gs);
          if (/official/i.test(String(card.resultStatus || ""))) selectedMatch.status = "finished";
          else if (/live|running/i.test(String(card.resultStatus || ""))) selectedMatch.status = "live";
          row._tt = selectedMatch;
          fixtureMap[id] = row;
        }
      } catch (e) {
        engineDebug("wtt card miss", { error: String(e && e.message || e) });
      }
    }
  }

    });
    $("autofetchBtn") && $("autofetchBtn").addEventListener("click", () => {
      const lg = (($("leagueSelect") || {}).value || "setka");
      if (!(($("leagueSelect") || {}).value)) {
        if ($("leagueSelect")) $("leagueSelect").value = "setka";
      }
      autofetchFixtures(lg === "wtt" || lg.indexOf("wtt") === 0 ? "setka" : (lg || "setka"));
    });
    $("autofetchWttBtn") && $("autofetchWttBtn").addEventListener("click", () => {
      if ($("leagueSelect") && !$("leagueSelect").value) $("leagueSelect").value = "wtt";
      const lg = (($("leagueSelect") || {}).value || "wtt");
      autofetchFixtures(lg.indexOf("wtt") === 0 ? lg : "wtt");
    });
    $("matchSelect") && $("matchSelect").addEventListener("change", () => onMatchPick($("matchSelect").value));
    $("fixtureSelect") && $("fixtureSelect").addEventListener("change", () => onMatchPick($("fixtureSelect").value));

    $("leagueSelect") && $("leagueSelect").addEventListener("change", () => {
      const lg = (($("leagueSelect") || {}).value || "").toLowerCase();
      populateMatchSelect([]);
      selectedMatch = null;
      if (isAutofetchLeague(lg)) {
        autofetchFixtures(lg);
      } else {
        setPickerStatus(lg ? "Manual league — enter players & lines" : "");
      }
    });

    document.querySelectorAll(".tracker-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tracker-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        trackerTab = tab.getAttribute("data-tab");
        renderTracker();
      });
    });

    $("dbgSaveWorker") && $("dbgSaveWorker").addEventListener("click", () => {
      const v = (($("workerUrlInput") || {}).value || "").trim().replace(/\/+$/, "");
      try { localStorage.setItem(STORE.worker, v); } catch (_e) {}
      engineDebug("worker saved", { v });
      setStatus("Worker saved", "ok");
    });
    $("dbgHealth") && $("dbgHealth").addEventListener("click", async () => {
      const wb = workerBase();
      if (!wb) { engineDebug("no worker url"); setStatus("Set Worker URL first", "err"); return; }
      try {
        const j = await ttFetch(wb + "/tt/health", { timeout: 8000 });
        engineDebug("health", j);
        setStatus("Worker healthy", "ok");
      } catch (e) {
        engineDebug("health fail", { error: String(e) });
        setStatus("Health ping failed", "err");
      }
    });
    $("dbgRaid") && $("dbgRaid").addEventListener("click", runMilitaryRaid);
    $("dbgClearLog") && $("dbgClearLog").addEventListener("click", () => {
      logLines.length = 0;
      reqLogLines.length = 0;
      lastRawPeek = "";
      if ($("debugLog")) $("debugLog").textContent = "";
      if ($("reqLog")) $("reqLog").textContent = "(no requests yet)";
      if ($("rawPeek")) $("rawPeek").textContent = "(empty)";
    });
    $("dbgClose") && $("dbgClose").addEventListener("click", closeDebug);

    engineDebug("boot", {
      build: BUILD_ID, markets: TT_MARKETS,
      leagues: document.querySelectorAll("#leagueSelect option").length,
      stub: false,
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
